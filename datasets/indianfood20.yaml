# IndianFood20 dataset — plated Indian dishes, 20 common classes.
#
# Source: Pandey et al., "Object Detection in Indian Food Platters
# using Transfer Learning with YOLOv4", IEEE ICDEW 2022. arXiv:2205.04841.
#
# This is a DISH-level dataset (whole plates) — complementary to
# AHAAR-Fridge, which is INGREDIENT-level. Used only in stage 1 of
# the two-stage transfer path to teach the backbone to attend to
# Indian-food textures before fine-tuning on the ingredient boxes.
#
# Fetch instructions:
#   bash datasets/scripts/fetch_indianfood20.sh
#
# Expected on-disk layout (set up by the fetch script):
#   datasets/raw/indianfood20/images/{train,val}/*.jpg
#   datasets/raw/indianfood20/labels/{train,val}/*.txt

path: ./datasets/raw/indianfood20
train: images/train
val:   images/val

names:
  0:  burger
  1:  butter_naan
  2:  chai
  3:  chapati
  4:  chole_bhature
  5:  dal_makhani
  6:  dhokla
  7:  fried_rice
  8:  idli
  9:  jalebi
  10: kaathi_rolls
  11: kadai_paneer
  12: kulfi
  13: masala_dosa
  14: momos
  15: paani_puri
  16: pakode
  17: pav_bhaji
  18: pizza
  19: samosa
