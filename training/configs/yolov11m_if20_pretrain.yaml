# YOLOv11m, two-stage transfer: COCO -> IndianFood20 -> AHAAR-Fridge.
#
# The `model` field points at a checkpoint produced by a prior
# IndianFood20 run — see training/README.md § "Two-stage transfer".
# If results/yolov11m_if20pretrain_stage1/weights/best.pt does not
# exist, train.py refuses to proceed and prints the exact command
# needed to build it first.

run_id: yolov11m_if20_pretrain
model: results/yolov11m_if20pretrain_stage1/weights/best.pt
data:  datasets/ahaar-fridge.yaml
imgsz: 640
epochs: 50
batch: 16
patience: 15
optimizer: auto
lr0: 0.005                  # lower LR since we're fine-tuning
seed: 42
device: auto
project: results
name: yolov11m_if20_pretrain
amp: true
cache: ram
freeze: 10                  # freeze first 10 backbone layers during fine-tune
