# Stage-1 of the two-stage transfer path: fine-tune a COCO-pretrained
# YOLOv11m on IndianFood20 before touching AHAAR-Fridge. Produces the
# checkpoint that yolov11m_if20_pretrain.yaml points to.

run_id: yolov11m_if20pretrain_stage1
model: yolo11m.pt
data:  datasets/indianfood20.yaml
imgsz: 640
epochs: 60
batch: 16
patience: 20
optimizer: auto
lr0: 0.01
seed: 42
device: auto
project: results
name: yolov11m_if20pretrain_stage1
amp: true
cache: false                # RAM caching ran out of memory on a 16 GB Windows laptop
workers: 4
